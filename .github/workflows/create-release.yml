name: Create Release Pull Request
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      bump:
        description: Minimum version bump for this release
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      notes:
        description: Additional release notes (required for an API-only release)
        type: string

concurrency: prepare-release
permissions:
  contents: read

jobs:
  release-pr:
    if: github.repository == 'simple-icons/simple-icons' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Generate notes and bump the version
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BUMP: ${{ inputs.bump || 'auto' }}
          EXTRA_NOTES: ${{ inputs.notes }}
        run: |
          base=$(git rev-parse HEAD)
          previous=$(node -p 'require("./package.json").version')
          if [[ "$(gh release view --json tagName --jq .tagName)" != "$previous" ]]; then
            echo "::error::Finish publishing the current version before preparing another release."
            exit 1
          fi
          node scripts/release/generate-release-note.mjs --json "refs/tags/$previous" "$base" > "$RUNNER_TEMP/changes.json"
          jq -r '.notes' "$RUNNER_TEMP/changes.json" > "$RUNNER_TEMP/notes.md"
          bump=$(jq -r '.bump // empty' "$RUNNER_TEMP/changes.json")
          if [[ -z "$bump" ]]; then
            if [[ "$REQUESTED_BUMP" == auto ]]; then exit 0; fi
            if [[ -z "$EXTRA_NOTES" ]]; then
              echo "::error::Supply release notes for a release without icon changes."
              exit 1
            fi
          fi
          case "$REQUESTED_BUMP:$bump" in
            major:*|minor:patch|minor:|patch:) bump="$REQUESTED_BUMP" ;;
          esac
          if [[ -n "$EXTRA_NOTES" ]]; then printf '\n%s\n' "$EXTRA_NOTES" >> "$RUNNER_TEMP/notes.md"; fi
          npm version --no-commit-hooks --no-git-tag-version "$bump"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Regenerate release files
        if: steps.prepare.outputs.version != ''
        run: |
          npm ci --no-audit --no-fund
          node scripts/release/update-cdn-urls.js
          node scripts/release/update-svgs-count.js
          node scripts/release/update-slugs-table.js
          node scripts/release/update-sdk-ts-defs.js
      - uses: actions/create-github-app-token@v3
        if: steps.prepare.outputs.version != ''
        id: app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Create or refresh the release PR
        if: steps.prepare.outputs.version != ''
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          branch: release/next
          author: 'simple-icons[bot] <simple-icons[bot]@users.noreply.github.com>'
          committer: 'simple-icons[bot] <simple-icons[bot]@users.noreply.github.com>'
          commit-message: |
            Bump version to ${{ steps.prepare.outputs.version }}

            Release base: ${{ steps.prepare.outputs.base }}
          title: Release ${{ steps.prepare.outputs.version }}
          body-path: ${{ runner.temp }}/notes.md
          labels: release
