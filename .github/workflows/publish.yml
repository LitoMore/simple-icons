name: Publish Releases
on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  sanity-check:
    name: Pre-publish checks
    if: |
      github.repository == 'simple-icons/simple-icons' &&
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/next' &&
      github.event.pull_request.user.login == 'simple-icons[bot]' &&
      github.event.pull_request.merged_by.login == 'simple-icons[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 3
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - id: version
        uses: ./.github/actions/get-version
      - name: Verify the reviewed tree and release version
        env:
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [[ "$(git rev-parse HEAD^2)" == "$REVIEWED_HEAD" ]]
          [[ "$(git rev-parse HEAD^1)" == "$(git rev-parse HEAD^2^1)" ]]
          git diff --exit-code HEAD^2 HEAD --
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git log -1 --format=%s)" == "Release $VERSION" ]]
          [[ "$(node -p 'require("./package-lock.json").version')" == "$VERSION" ]]
      - run: npm ci --no-audit --no-fund
      - run: node --run lint
      - run: node --run build
      - run: node --run test
  npm:
    name: NPM Package
    needs: sanity-check
    concurrency: npm-${{ needs.sanity-check.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Prepare the npm package
        run: |
          node scripts/release/reformat-markdown.js
          node scripts/release/update-sdk-ts-defs.js
          node scripts/release/minify-icons-data.js
          node --run build
          npm pack --quiet --pack-destination "$RUNNER_TEMP"
      - name: Publish the verified tarball
        env:
          VERSION: ${{ needs.sanity-check.outputs.version }}
        run: |
          tarball="$RUNNER_TEMP/simple-icons-$VERSION.tgz"
          integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          metadata="$RUNNER_TEMP/registry.json"
          status=$(curl --silent --show-error --retry 3 --output "$metadata" --write-out '%{http_code}' \
            "https://registry.npmjs.org/simple-icons/$VERSION")
          case "$status" in
            404) npm publish "$tarball" ;;
            200) [[ "$(jq -er '.dist.integrity' "$metadata")" == "$integrity" ]] ;;
            *) echo "::error::npm registry returned HTTP $status"; exit 1 ;;
          esac
  github:
    name: GitHub release
    needs: [sanity-check, npm]
    concurrency: github-release-${{ needs.sanity-check.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Create the formatted tag and GitHub release
        id: release
        env:
          VERSION: ${{ needs.sanity-check.outputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git log -1 --format=%B > "$RUNNER_TEMP/tag-message"
          git log -1 --format=%b > "$RUNNER_TEMP/notes.md"
          node scripts/release/reformat-markdown.js
          git add README.md
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            [[ "$(git rev-parse "refs/tags/$VERSION^")" == "$(git rev-parse HEAD)" ]]
            [[ "$(git rev-parse "refs/tags/$VERSION^{tree}")" == "$(git write-tree)" ]]
          else
            git config user.name 'simple-icons[bot]'
            git config user.email 'simple-icons[bot]@users.noreply.github.com'
            git commit --allow-empty -m 'Replace README CDN theme image links'
            git tag -a "$VERSION" -F "$RUNNER_TEMP/tag-message"
            git push origin "refs/tags/$VERSION"
          fi
          if gh release view "$VERSION" --json name,isDraft,isPrerelease > "$RUNNER_TEMP/release.json"; then
            jq -e --arg title "Release $VERSION" '.name == $title and (.isDraft or .isPrerelease | not)' "$RUNNER_TEMP/release.json"
          else
            gh release create "$VERSION" --verify-tag --title "Release $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Send release to Discord
        if: steps.release.outputs.created == 'true'
        run: node scripts/release/discord-release-message.js "$VERSION"
        env:
          VERSION: ${{ needs.sanity-check.outputs.version }}
          DISCORD_RELEASES_ROLE_ID: ${{ secrets.DISCORD_RELEASES_ROLE_ID }}
          DISCORD_RELEASES_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
        continue-on-error: true
  downstream:
    name: Trigger ${{ matrix.repository }}
    needs: [npm, github]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository: [simple-icons-font, simple-icons-website-rs]
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: ${{ matrix.repository }}
      - name: Dispatch the receiver's default branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: simple-icons/${{ matrix.repository }}
        run: gh workflow run auto-release.yml
